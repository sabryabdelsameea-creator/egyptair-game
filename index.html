<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محاكي مصر للطيران 3D</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
        
        #hud { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 10; display: flex; justify-content: space-between; pointer-events: none; }
        .hud-card { background: rgba(5, 15, 35, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(212, 175, 55, 0.6); color: #fff; padding: 10px 15px; border-radius: 12px; pointer-events: auto; }
        .title { color: #D4AF37; font-weight: bold; font-size: 15px; margin-bottom: 3px; }
        .val { font-size: 18px; font-weight: bold; color: #4deaea; }
        
        .btn-action { background: linear-gradient(135deg, #D4AF37, #AA7C11); color: #001f3f; border: none; padding: 8px 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 5px; width: 100%; }
        
        #controls-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 15px; pointer-events: auto; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 30px; }
        .ctrl-btn { background: #002D62; color: #D4AF37; border: 2px solid #D4AF37; width: 60px; height: 60px; border-radius: 50%; font-size: 22px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div class="hud-card">
            <div class="title">✈️ مصر للطيران - EGYPTAIR</div>
            <div id="status-text" style="font-size:12px; color:#ccc;">الوضعية: بوابة المطار (Gate 4)</div>
            <button id="mainActionBtn" class="btn-action" onclick="handleBoarding()">بدء صعود الركاب 👥</button>
        </div>
        <div class="hud-card" style="min-width: 120px; text-align: center;">
            <div style="font-size: 10px; color: #aaa;">السرعة AIRSPEED</div>
            <div class="val"><span id="spdVal">0</span> <span style="font-size:11px;">KTS</span></div>
            <div style="font-size: 10px; color: #aaa; margin-top:3px;">الارتفاع ALTITUDE</div>
            <div class="val" style="color:#2ecc71;"><span id="altVal">0</span> <span style="font-size:11px;">FT</span></div>
        </div>
    </div>

    <div id="controls-panel">
        <button class="ctrl-btn" onclick="steer(-0.04)">◀</button>
        <button class="ctrl-btn" onclick="addThrottle()" style="border-color:#2ecc71; color:#2ecc71;">▲</button>
        <button class="ctrl-btn" onclick="steer(0.04)">▶</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.0005);

        // تعديل زاوية رؤية الكاميرا (FOV) ورؤيتها لمسافات بعيدة
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // الإضاءة
        const dirLight = new THREE.DirectionalLight(0xfffaed, 2.0);
        dirLight.position.set(200, 400, 200);
        dirLight.castShadow = true;
        scene.add(dirLight);
        scene.add(new THREE.AmbientLight(0x88abdc, 1.2));

        // البحر
        const seaGeo = new THREE.PlaneGeometry(8000, 8000);
        const seaMat = new THREE.MeshStandardMaterial({ color: 0x004466, roughness: 0.1, metalness: 0.7 });
        const sea = new THREE.Mesh(seaGeo, seaMat);
        sea.rotation.x = -Math.PI / 2;
        sea.position.y = -2;
        scene.add(sea);

        // المطار والممر
        const airportGroup = new THREE.Group();
        const runwayGeo = new THREE.PlaneGeometry(120, 2000);
        const runwayMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const runway = new THREE.Mesh(runwayGeo, runwayMat);
        runway.rotation.x = -Math.PI / 2;
        airportGroup.add(runway);

        // خطوط الممر
        const markGeo = new THREE.PlaneGeometry(4, 30);
        const markMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for(let i = -800; i < 800; i += 100) {
            const m = new THREE.Mesh(markGeo, markMat);
            m.rotation.x = -Math.PI / 2;
            m.position.set(0, 0.1, i);
            airportGroup.add(m);
        }

        // مبنى الركاب
        const termGeo = new THREE.BoxGeometry(250, 50, 100);
        const termMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, metalness: 0.4 });
        const terminal = new THREE.Mesh(termGeo, termMat);
        terminal.position.set(-200, 25, -400);
        airportGroup.add(terminal);

        scene.add(airportGroup);

        // --- تصميم طائرة متناسق ومضبوط الأبعاد ---
        const planeGroup = new THREE.Group();

        const fuseMat = new THREE.MeshStandardMaterial({ color: 0xfcfcfc, roughness: 0.2, metalness: 0.3 });
        const blueMat = new THREE.MeshStandardMaterial({ color: 0x002D62, roughness: 0.3 }); // أزرق مصر للطيران

        // جسم الطائرة
        const bodyGeo = new THREE.CylinderGeometry(3, 2.8, 40, 24);
        const body = new THREE.Mesh(bodyGeo, fuseMat);
        body.rotation.x = Math.PI / 2;
        planeGroup.add(body);

        // مقدمة الطائرة
        const noseGeo = new THREE.ConeGeometry(3, 8, 24);
        const nose = new THREE.Mesh(noseGeo, fuseMat);
        nose.rotation.x = -Math.PI / 2;
        nose.position.z = 24;
        planeGroup.add(nose);

        // الكابينة الزجاجية
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.1 });
        const glassGeo = new THREE.BoxGeometry(3.2, 1.5, 2.5);
        const glass = new THREE.Mesh(glassGeo, glassMat);
        glass.position.set(0, 1.5, 21);
        planeGroup.add(glass);

        // الأجنحة
        const wingGeo = new THREE.BoxGeometry(36, 0.4, 6);
        const wings = new THREE.Mesh(wingGeo, fuseMat);
        wings.position.set(0, 0, 2);
        planeGroup.add(wings);

        // المحركات
        const engGeo = new THREE.CylinderGeometry(1.2, 1.0, 7, 16);
        const engMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 });
        
        const engR = new THREE.Mesh(engGeo, engMat);
        engR.rotation.x = Math.PI / 2;
        engR.position.set(8, -2, 2);
        planeGroup.add(engR);

        const engL = new THREE.Mesh(engGeo, engMat);
        engL.rotation.x = Math.PI / 2;
        engL.position.set(-8, -2, 2);
        planeGroup.add(engL);

        // الذيل (ضبط الأبعاد لتجنب الحجب)
        const tailGeo = new THREE.BoxGeometry(0.4, 8, 5);
        const tail = new THREE.Mesh(tailGeo, blueMat);
        tail.position.set(0, 4.5, -17);
        planeGroup.add(tail);

        // وضع الطائرة في المطار
        planeGroup.position.set(-30, 3.5, -400);
        scene.add(planeGroup);

        // --- الركاب ---
        const passengersGroup = new THREE.Group();
        const passMat = [new THREE.MeshStandardMaterial({ color: 0xcc2222 }), new THREE.MeshStandardMaterial({ color: 0x228822 })];

        function createPassenger(x, z, mat) {
            const p = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.3, 1.8, 8), mat);
            body.position.y = 0.9;
            p.add(body);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffdbac }));
            head.position.y = 2.0;
            p.add(head);
            p.position.set(x, 0, z);
            return p;
        }

        let passengers = [];
        for(let i=0; i<6; i++) {
            const pass = createPassenger(-60 + (i * -4), -400, passMat[i % 2]);
            passengersGroup.add(pass);
            passengers.push(pass);
        }
        scene.add(passengersGroup);

        // --- ضبط مسافة الكاميرا البعيدة والواضحة ---
        function updateCamera() {
            // المسافة خلف الطائرة والارتفاع
            const offset = new THREE.Vector3(0, 18, -65); 
            offset.applyQuaternion(planeGroup.quaternion);
            camera.position.copy(planeGroup.position).add(offset);
            
            // جعل الكاميرا تنظر للأمام وللطائرة بالكامل
            const lookTarget = planeGroup.position.clone().add(new THREE.Vector3(0, 4, 30).applyQuaternion(planeGroup.quaternion));
            camera.lookAt(lookTarget);
        }

        updateCamera();

        // --- التحكم والفيزياء ---
        let gameStage = 0;
        let speed = 0;
        let steering = 0;

        function handleBoarding() {
            const btn = document.getElementById('mainActionBtn');
            const status = document.getElementById('status-text');

            if(gameStage === 0) {
                gameStage = 1;
                status.innerText = "جاري صعود الركاب كابينة الطائرة...";
                btn.style.display = 'none';

                let step = 0;
                const boardInterval = setInterval(() => {
                    passengers.forEach((p) => {
                        if(p.position.x < -30) p.position.x += 0.5;
                        else p.visible = false;
                    });
                    step++;
                    if(step > 70) {
                        clearInterval(boardInterval);
                        status.innerText = "اكتمل الصعود! الطائرة جاهزة للقيادة";
                        btn.innerText = "بدء التأكسي (Taxiing)";
                        btn.style.display = 'block';
                        gameStage = 2;
                    }
                }, 50);
            } else if(gameStage === 2) {
                status.innerText = "في مرحلة التأكسي... اتجه للممر واقلع!";
                btn.style.display = 'none';
            }
        }

        function addThrottle() {
            if(gameStage === 2 && speed < 2.5) speed += 0.3;
        }

        function steer(val) {
            if(gameStage === 2) steering -= val;
        }

        function animate() {
            requestAnimationFrame(animate);

            if(gameStage === 2) {
                planeGroup.translateZ(speed);
                planeGroup.rotation.y += steering;
                steering *= 0.88;

                // الإقلاع عند السرعة
                if(speed > 1.2) {
                    planeGroup.position.y += (speed - 1.2) * 0.7;
                    planeGroup.rotation.x = -Math.min((speed - 1.2) * 0.08, 0.2);
                }

                speed *= 0.992;

                document.getElementById('spdVal').innerText = Math.round(speed * 120);
                document.getElementById('altVal').innerText = Math.round((planeGroup.position.y - 3.5) * 20);

                updateCamera();
            } else {
                updateCamera();
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
