<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محاكي مصر للطيران - EGYPTAIR Flight Sim</title>
    <style>
        * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; overflow: hidden; background: #0b1526; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
        
        /* HUD & UI - Stylized Gold Theme */
        #hud { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 10; display: flex; justify-content: space-between; pointer-events: none; }
        .hud-card { background: rgba(10, 20, 38, 0.85); backdrop-filter: blur(10px); border: 2px solid #D4AF37; color: #fff; padding: 12px 18px; border-radius: 14px; pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .title { color: #D4AF37; font-weight: bold; font-size: 16px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .val { font-size: 22px; font-weight: bold; color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
        
        .btn-action { background: linear-gradient(135deg, #D4AF37, #AA7C11); color: #001f3f; border: none; padding: 10px 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 8px; width: 100%; transition: all 0.2s; box-shadow: 0 4px 15px rgba(212,175,55,0.5); font-size: 14px; }
        .btn-action:active { transform: scale(0.96); }
        
        /* Controls Panel */
        #controls-panel { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 15px; pointer-events: auto; background: rgba(5,12,25,0.7); padding: 12px 24px; border-radius: 40px; border: 1.5px solid rgba(212,175,55,0.5); box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .ctrl-btn { background: linear-gradient(145deg, #002D62, #001530); color: #D4AF37; border: 2px solid #D4AF37; width: 65px; height: 65px; border-radius: 50%; font-size: 24px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.6); transition: transform 0.1s; }
        .ctrl-btn:active { transform: scale(0.9); background: #D4AF37; color: #002D62; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div class="hud-card">
            <div class="title">✈️ مصر للطيران - EGYPTAIR</div>
            <div id="status-text" style="font-size:13px; color:#ddd;">مطار القاهرة - مطار الإسكندرية (غروب الشمس)</div>
            <button id="mainActionBtn" class="btn-action" onclick="handleBoarding()">صعود الركاب (Gate 4) 👥</button>
        </div>
        <div class="hud-card" style="min-width: 130px; text-align: center;">
            <div style="font-size: 11px; color: #aaa;">السرعة KTS</div>
            <div class="val"><span id="spdVal">0</span></div>
            <div style="font-size: 11px; color: #aaa; margin-top:4px;">الارتفاع FT</div>
            <div class="val" style="color:#2ecc71;"><span id="altVal">0</span></div>
        </div>
    </div>

    <div id="controls-panel">
        <button class="ctrl-btn" onclick="steer(-0.04)">◀</button>
        <button class="ctrl-btn" onclick="addThrottle()" style="border-color:#2ecc71; color:#2ecc71;">▲</button>
        <button class="ctrl-btn" onclick="steer(0.04)">▶</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // إضاءة وسماء الغروب السينمائية (Alexandria/Cairo Sunset Sky)
        scene.background = new THREE.Color(0xfb8c00);
        scene.fog = new THREE.FogExp2(0xf57c00, 0.0003);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 8000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        // إضاءة الشمس الذهبية
        const sunLight = new THREE.DirectionalLight(0xffecd2, 2.5);
        sunLight.position.set(400, 250, -800);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0xd1a153, 1.1);
        scene.add(ambientLight);

        // --- البحر بتأثير الغروب (Mediterranean Sea) ---
        const seaGeo = new THREE.PlaneGeometry(10000, 10000);
        const seaMat = new THREE.MeshStandardMaterial({ color: 0x0a2f44, roughness: 0.15, metalness: 0.85 });
        const sea = new THREE.Mesh(seaGeo, seaMat);
        sea.rotation.x = -Math.PI / 2;
        sea.position.y = -2;
        scene.add(sea);

        // --- المطار والأرض ---
        const airportGroup = new THREE.Group();
        const runwayGeo = new THREE.PlaneGeometry(140, 2500);
        const runwayMat = new THREE.MeshStandardMaterial({ color: 0x22222a, roughness: 0.8 });
        const runway = new THREE.Mesh(runwayGeo, runwayMat);
        runway.rotation.x = -Math.PI / 2;
        runway.receiveShadow = true;
        airportGroup.add(runway);

        // خطوط الممر
        const markGeo = new THREE.PlaneGeometry(5, 35);
        const markMat = new THREE.MeshBasicMaterial({ color: 0xffb74d });
        for(let i = -1000; i < 1000; i += 120) {
            const m = new THREE.Mesh(markGeo, markMat);
            m.rotation.x = -Math.PI / 2;
            m.position.set(0, 0.1, i);
            airportGroup.add(m);
        }

        scene.add(airportGroup);

        // --- معالم مصرية (قلعة قايتباي والأهرامات) ---
        // 1. قلعة قايتباي (Citadel of Qaitbay)
        const qaitbayGroup = new THREE.Group();
        const mainFort = new THREE.Mesh(new THREE.BoxGeometry(100, 45, 100), new THREE.MeshStandardMaterial({ color: 0xd7ccc8, roughness: 0.9 }));
        mainFort.position.y = 22.5;
        qaitbayGroup.add(mainFort);

        for(let angle = 0; angle < Math.PI * 2; angle += Math.PI / 2) {
            const tower = new THREE.Mesh(new THREE.CylinderGeometry(12, 12, 55, 16), new THREE.MeshStandardMaterial({ color: 0xbcaaa4 }));
            tower.position.set(Math.cos(angle) * 50, 27.5, Math.sin(angle) * 50);
            qaitbayGroup.add(tower);
        }
        qaitbayGroup.position.set(600, 0, 800);
        scene.add(qaitbayGroup);

        // 2. الأهرامات الثلاثة (Pyramids of Giza)
        function createPyramid(size, x, z) {
            const pyr = new THREE.Mesh(new THREE.ConeGeometry(size, size * 0.8, 4), new THREE.MeshStandardMaterial({ color: 0xd7a15c, roughness: 0.9 }));
            pyr.position.set(x, (size * 0.8) / 2, z);
            pyr.rotation.y = Math.PI / 4;
            scene.add(pyr);
        }
        createPyramid(220, -1200, 1500);
        createPyramid(180, -900, 1800);
        createPyramid(120, -650, 2000);

        // --- طائرة مصر للطيران (Boeing EgyptAir Model) ---
        const planeGroup = new THREE.Group();

        const fuseMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.4 });
        const blueMat = new THREE.MeshStandardMaterial({ color: 0x002D62, roughness: 0.3, metalness: 0.5 }); // أزرق مصر للطيران

        // جسم الطائرة الانسيابي
        const bodyGeo = new THREE.CylinderGeometry(3.2, 3.0, 42, 32);
        const body = new THREE.Mesh(bodyGeo, fuseMat);
        body.rotation.x = Math.PI / 2;
        body.castShadow = true;
        planeGroup.add(body);

        // المقدمة الكروية
        const noseGeo = new THREE.ConeGeometry(3.2, 9, 32);
        const nose = new THREE.Mesh(noseGeo, fuseMat);
        nose.rotation.x = -Math.PI / 2;
        nose.position.z = 25.5;
        nose.castShadow = true;
        planeGroup.add(nose);

        // الكابينة
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x050510, roughness: 0.1, metalness: 0.9 });
        const glass = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.6, 2.8), glassMat);
        glass.position.set(0, 1.6, 22);
        planeGroup.add(glass);

        // الأجنحة المائلة الانسيابية
        const wingShape = new THREE.Shape();
        wingShape.moveTo(0, 0);
        wingShape.lineTo(24, -10);
        wingShape.lineTo(24, -15);
        wingShape.lineTo(0, -5);
        const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.6, bevelEnabled: true, bevelSize: 0.1 });
        
        const rWing = new THREE.Mesh(wingGeo, fuseMat);
        rWing.rotation.x = Math.PI / 2;
        rWing.position.set(0, 0, 2);
        planeGroup.add(rWing);

        const lWing = new THREE.Mesh(wingGeo, fuseMat);
        lWing.rotation.x = Math.PI / 2;
        lWing.scale.set(-1, 1, 1);
        lWing.position.set(0, 0, 2);
        planeGroup.add(lWing);

        // المحركات
        const engMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
        const engR = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.1, 8, 20), engMat);
        engR.rotation.x = Math.PI / 2;
        engR.position.set(9, -2, 2);
        planeGroup.add(engR);

        const engL = new THREE.Mesh(engGeo = new THREE.CylinderGeometry(1.3, 1.1, 8, 20), engMat);
        engL.rotation.x = Math.PI / 2;
        engL.position.set(-9, -2, 2);
        planeGroup.add(engL);

        // ذيل الطائرة المزركش بأزرق مصر للطيران
        const tailShape = new THREE.Shape();
        tailShape.moveTo(0, 0);
        tailShape.lineTo(0, 12);
        tailShape.lineTo(-7, 9);
        tailShape.lineTo(-10, 0);
        const tail = new THREE.Mesh(new THREE.ExtrudeGeometry(tailShape, { depth: 0.5, bevelEnabled: false }), blueMat);
        tail.position.set(0, 3, -16);
        planeGroup.add(tail);

        // موضع البداية عند الممر
        planeGroup.position.set(0, 3.5, -800);
        scene.add(planeGroup);

        // --- ضبط زاوية الكاميرا السينمائية خلف الطائرة ---
        function updateCamera() {
            const camOffset = new THREE.Vector3(0, 16, -75);
            camOffset.applyQuaternion(planeGroup.quaternion);
            camera.position.copy(planeGroup.position).add(camOffset);
            
            const lookTarget = planeGroup.position.clone().add(new THREE.Vector3(0, 4, 30).applyQuaternion(planeGroup.quaternion));
            camera.lookAt(lookTarget);
        }

        // --- اللوجيك والفيزياء ---
        let gameStage = 0;
        let speed = 0;
        let steering = 0;

        function handleBoarding() {
            const btn = document.getElementById('mainActionBtn');
            const status = document.getElementById('status-text');

            if(gameStage === 0) {
                gameStage = 1;
                status.innerText = "اكتمل صعود الركاب كابينة الطائرة! 👥";
                btn.innerText = "بدء المحركات والتأكسي ✈️";
                gameStage = 2;
            }
        }

        function addThrottle() {
            if(gameStage === 2 && speed < 3.2) speed += 0.35;
        }

        function steer(val) {
            if(gameStage === 2) steering -= val;
        }

        // الحلقة المتحركة
        function animate() {
            requestAnimationFrame(animate);

            if(gameStage === 2) {
                planeGroup.translateZ(speed);
                planeGroup.rotation.y += steering;
                steering *= 0.88;

                // الإقلاع فوق المعالم
                if(speed > 1.3) {
                    planeGroup.position.y += (speed - 1.3) * 0.9;
                    planeGroup.rotation.x = -Math.min((speed - 1.3) * 0.08, 0.28);
                }

                speed *= 0.993;

                document.getElementById('spdVal').innerText = Math.round(speed * 110);
                document.getElementById('altVal').innerText = Math.round((planeGroup.position.y - 3.5) * 25);
            }

            updateCamera();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
